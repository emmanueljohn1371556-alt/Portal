<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joseph Sarwuan Tarka University Portal</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#18202e;--muted:#5d6a80;--line:#dde3ee;--brand:#1d4ed8;--side:#0f1c3a;--ok:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#172033;--text:#e8edf6;--muted:#9aa8c0;--line:#27324a;--brand:#6b9bff;--side:#0a1226}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text)}
[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
h1,h2,h3{margin:0 0 12px}
input,select,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);width:100%;margin:0 0 10px}
button{background:var(--brand);color:#fff;border:0;cursor:pointer;width:auto;font-weight:600}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button.red{background:var(--bad)}
#auth{max-width:400px;margin:8vh auto;padding:0 16px}
#app{display:flex;min-height:100vh}
aside{width:210px;background:var(--side);color:#fff;padding:18px;flex:none}
aside b{display:block;margin-bottom:16px}
aside a{display:block;color:#cfd8ea;padding:10px;border-radius:8px;cursor:pointer;text-decoration:none}
aside a.on,aside a:hover{background:rgba(255,255,255,.12);color:#fff}
main{flex:1;padding:20px;min-width:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
.wide{overflow-x:auto}
.muted{color:var(--muted)}
.msg{color:var(--bad);min-height:1.4em}
.row{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
td input,td select{margin:0;padding:6px 8px}
@media (max-width:700px){#app{flex-direction:column}aside{width:100%;display:flex;flex-wrap:wrap;gap:4px;align-items:center}aside b{width:100%;margin:0}}
</style>
</head>
<body>

<div id="auth">
<div class="card">
<h2 style="color:var(--brand)">Joseph Sarwuan Tarka University</h2>
<p class="muted" style="margin-top:-6px">Student and staff portal</p>
<h1 id="authTitle">Sign in</h1>
<div id="regFields" hidden>
<input id="name" placeholder="Full name">
<input id="matric" placeholder="Matric number">
<input id="dept" placeholder="Department">
<select id="level"><option>100</option><option>200</option><option>300</option><option>400</option><option>500</option></select>
</div>
<input id="email" type="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password (6+ characters)">
<div class="msg" id="authMsg"></div>
<button id="authBtn">Sign in</button>
<button class="ghost" id="authSwitch">Create student account</button>
</div>
</div>

<div id="app" hidden>
<aside><b style="font-size:15px">Joseph Sarwuan Tarka University</b><b id="who" style="font-weight:400;opacity:.8"></b><nav id="nav"></nav><a id="out">Sign out</a></aside>
<main id="main"></main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,getDocs,query,where,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDpCpGBL7JzhuJlQJxzhKY5eD87dcayP6c",
  authDomain: "jostum.firebaseapp.com",
  projectId: "jostum",
  storageBucket: "jostum.firebasestorage.app",
  messagingSenderId: "709930109305",
  appId: "1:709930109305:web:4c5135acbd60f2b41d87a8",
  measurementId: "G-3BJPLCLPBB"
};

const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grade=s=>s>=70?["A",5]:s>=60?["B",4]:s>=50?["C",3]:s>=45?["D",2]:s>=40?["E",1]:["F",0];
const list=async q=>(await getDocs(q)).docs.map(d=>({id:d.id,...d.data()}));
let me=null,reg=false;

/* ---------- AUTH ---------- */
$("#authSwitch").onclick=()=>{reg=!reg;$("#regFields").hidden=!reg;$("#authTitle").textContent=reg?"Create student account":"Sign in";$("#authBtn").textContent=reg?"Register":"Sign in";$("#authSwitch").textContent=reg?"I have an account":"Create student account"};
$("#authBtn").onclick=async()=>{
  $("#authMsg").textContent="";
  try{
    const e=$("#email").value.trim(),p=$("#pass").value;
    if(reg){
      if(!$("#name").value.trim()||!$("#matric").value.trim())throw new Error("Enter your name and matric number.");
      const c=await createUserWithEmailAndPassword(auth,e,p);
      await setDoc(doc(db,"users",c.user.uid),{name:$("#name").value.trim(),matricNo:$("#matric").value.trim(),department:$("#dept").value.trim(),level:$("#level").value,email:e,role:"student"});
    }else await signInWithEmailAndPassword(auth,e,p);
  }catch(err){$("#authMsg").textContent=err.message.replace("Firebase: ","")}
};
$("#out").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
  if(!u){me=null;$("#app").hidden=true;$("#auth").hidden=false;return}
  let s=await getDoc(doc(db,"users",u.uid));
  for(let i=0;!s.exists()&&i<5;i++){await new Promise(r=>setTimeout(r,500));s=await getDoc(doc(db,"users",u.uid))}
  if(!s.exists()){$("#authMsg").textContent="Profile not found.";return}
  me={uid:u.uid,...s.data()};
  $("#auth").hidden=true;$("#app").hidden=false;
  $("#who").textContent=me.name+" ("+me.role+")";
  const tabs={student:[["profile","Profile"],["courses","Courses"],["results","Results"],["news","Notices"]],
    lecturer:[["teach","My courses"],["news","Notices"]],
    admin:[["manage","Admin"],["teach","Scores"],["news","Notices"]]}[me.role]||[["news","Notices"]];
  $("#nav").innerHTML=tabs.map(t=>`<a data-v="${t[0]}">${t[1]}</a>`).join("");
  show(tabs[0][0]);
});
$("#nav").onclick=e=>{const a=e.target.closest("[data-v]");if(a)show(a.dataset.v)};
async function show(v){
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  $("#main").innerHTML='<p class="muted">Loading…</p>';
  try{await views[v]()}catch(e){$("#main").innerHTML=`<div class="card msg">${esc(e.message)}</div>`}
}
const put=h=>$("#main").innerHTML=h;

/* ---------- VIEWS ---------- */
const views={
async profile(){
  put(`<div class="card"><h2>My profile</h2><div class="row">
  <div><label class="muted">Name</label><input id="pn" value="${esc(me.name)}"></div>
  <div><label class="muted">Matric no.</label><input id="pm" value="${esc(me.matricNo)}"></div>
  <div><label class="muted">Department</label><input id="pd" value="${esc(me.department)}"></div>
  <div><label class="muted">Level</label><input id="pl" value="${esc(me.level)}"></div></div>
  <p class="muted">${esc(me.email)}</p><button id="ps">Save changes</button> <span id="pmsg" class="muted"></span></div>`);
  $("#ps").onclick=async()=>{
    const d={name:$("#pn").value.trim(),matricNo:$("#pm").value.trim(),department:$("#pd").value.trim(),level:$("#pl").value.trim()};
    await updateDoc(doc(db,"users",me.uid),d);Object.assign(me,d);$("#pmsg").textContent="Saved.";$("#who").textContent=me.name+" ("+me.role+")"};
},

async courses(){
  const [all,mine]=await Promise.all([list(collection(db,"courses")),list(query(collection(db,"registrations"),where("studentId","==",me.uid),where("session","==",SESSION)))]);
  const ids=new Set(mine.map(r=>r.courseId));
  const units=all.filter(c=>ids.has(c.id)).reduce((a,c)=>a+Number(c.unit),0);
  put(`<div class="card"><h2>Course registration, ${SESSION}</h2><p class="muted">Registered units: <b>${units}</b></p><div class="wide"><table>
  <tr><th>Code</th><th>Title</th><th>Units</th><th>Semester</th><th></th></tr>
  ${all.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.title)}</td><td>${esc(c.unit)}</td><td>${esc(c.semester)}</td>
  <td>${ids.has(c.id)?`<button class="red" data-drop="${esc(c.id)}">Drop</button>`:`<button data-add="${esc(c.id)}">Register</button>`}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">No courses yet.</td></tr>'}
  </table></div></div>`);
  $("#main").onclick=async e=>{
    const a=e.target.dataset.add,d=e.target.dataset.drop,id=a||d;if(!id)return;
    const ref=doc(db,"registrations",`${me.uid}_${id}_${SESSION.replace("/","-")}`);
    if(a)await setDoc(ref,{studentId:me.uid,courseId:id,session:SESSION});else await deleteDoc(ref);
    show("courses")};
},

async results(){
  const rs=await list(query(collection(db,"results"),where("studentId","==",me.uid)));
  const by={};rs.forEach(r=>(by[r.session]=by[r.session]||[]).push(r));
  const gpa=a=>{const u=a.reduce((x,r)=>x+Number(r.unit),0);return u?(a.reduce((x,r)=>x+grade(r.score)[1]*Number(r.unit),0)/u).toFixed(2):"0.00"};
  put(`<div class="card"><h2>CGPA: ${gpa(rs)}</h2><p class="muted">5-point scale: A=5, B=4, C=3, D=2, E=1, F=0.</p></div>`+
  (Object.keys(by).sort().map(s=>`<div class="card"><h3>${esc(s)} <span class="muted">GPA ${gpa(by[s])}</span></h3><div class="wide"><table>
  <tr><th>Code</th><th>Title</th><th>Units</th><th>Score</th><th>Grade</th></tr>
  ${by[s].map(r=>`<tr><td>${esc(r.courseId)}</td><td>${esc(r.title)}</td><td>${esc(r.unit)}</td><td>${esc(r.score)}</td><td>${grade(r.score)[0]}</td></tr>`).join("")}</table></div></div>`).join("")||'<div class="card muted">No results published yet.</div>'));
},

async news(){
  const a=await list(query(collection(db,"announcements"),orderBy("date","desc")));
  put(a.map(n=>`<div class="card"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><small class="muted">${new Date(n.date).toLocaleDateString()}</small></div>`).join("")||'<div class="card muted">No notices.</div>');
},

async teach(){
  const cs=(await list(collection(db,"courses"))).filter(c=>me.role==="admin"||c.lecturerId===me.uid);
  put(`<div class="card"><h2>Enter scores</h2><select id="tc"><option value="">Choose a course</option>${cs.map(c=>`<option value="${esc(c.id)}">${esc(c.id)} · ${esc(c.title)}</option>`).join("")}</select><div id="tb"></div></div>`);
  $("#tc").onchange=async()=>{
    const cid=$("#tc").value;if(!cid){$("#tb").innerHTML="";return}
    const c=cs.find(x=>x.id===cid);
    const rg=(await list(query(collection(db,"registrations"),where("courseId","==",cid),where("session","==",SESSION))));
    const rs=await list(query(collection(db,"results"),where("courseId","==",cid),where("session","==",SESSION)));
    const sc={};rs.forEach(r=>sc[r.studentId]=r.score);
    const us=await Promise.all(rg.map(r=>getDoc(doc(db,"users",r.studentId))));
    $("#tb").innerHTML=`<div class="wide"><table><tr><th>Matric</th><th>Name</th><th>Score (0–100)</th></tr>${us.map(u=>{const d=u.data()||{};return`<tr><td>${esc(d.matricNo)}</td><td>${esc(d.name)}</td><td><input type="number" min="0" max="100" data-s="${u.id}" value="${sc[u.id]??""}"></td></tr>`}).join("")||'<tr><td colspan="3" class="muted">No students registered.</td></tr>'}</table></div><button id="sv">Save scores</button> <span id="sm" class="muted"></span>`;
    $("#sv").onclick=async()=>{
      for(const i of document.querySelectorAll("[data-s]")){
        if(i.value==="")continue;const v=Math.min(100,Math.max(0,Number(i.value)));
        await setDoc(doc(db,"results",`${i.dataset.s}_${cid}_${SESSION.replace("/","-")}`),{studentId:i.dataset.s,courseId:cid,title:c.title,unit:Number(c.unit),score:v,session:SESSION,by:me.uid})}
      $("#sm").textContent="Saved."};
  };
},

async manage(){
  const [us,cs]=await Promise.all([list(collection(db,"users")),list(collection(db,"courses"))]);
  const lec=us.filter(u=>u.role==="lecturer");
  put(`<div class="card"><h2>Add course</h2><div class="row"><input id="cc" placeholder="Code e.g. PHY 101"><input id="ct" placeholder="Title"><input id="cu" type="number" placeholder="Units"><select id="cs"><option>First</option><option>Second</option></select>
  <select id="cl"><option value="">Lecturer</option>${lec.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select></div><button id="ca">Add course</button></div>
  <div class="card"><h2>Post notice</h2><input id="at" placeholder="Title"><input id="ab" placeholder="Message"><button id="ap">Publish</button></div>
  <div class="card"><h2>Users</h2><div class="wide"><table><tr><th>Name</th><th>Email</th><th>Role</th></tr>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><select data-r="${u.id}">${["student","lecturer","admin"].map(r=>`<option${u.role===r?" selected":""}>${r}</option>`).join("")}</select></td></tr>`).join("")}</table></div></div>
  <div class="card"><h2>Courses (${cs.length})</h2><p class="muted">${cs.map(c=>esc(c.id)).join(", ")}</p></div>`);
  $("#ca").onclick=async()=>{const c=$("#cc").value.trim();if(!c||!$("#ct").value)return;
    await setDoc(doc(db,"courses",c),{title:$("#ct").value.trim(),unit:Number($("#cu").value||0),semester:$("#cs").value,lecturerId:$("#cl").value});show("manage")};
  $("#ap").onclick=async()=>{if(!$("#at").value)return;await addDoc(collection(db,"announcements"),{title:$("#at").value.trim(),body:$("#ab").value.trim(),date:Date.now()});show("manage")};
  $("#main").onchange=async e=>{const r=e.target.dataset.r;if(r)await updateDoc(doc(db,"users",r),{role:e.target.value})};
}
};
</script>
</body>
</html>
